openapi: 3.0.3
info:
  title: Petstore API
  description: |
    Petstore アプリケーション API 定義（agoncal/agoncal-application-petstore-ee7 の移植向け）。
    すべて JSON 入出力。認証は Bearer JWT を想定。
  version: "1.0.0"
servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8080
    description: Local development
paths:
  /api/pets:
    get:
      tags: [Pets]
      summary: ペット一覧取得（ページネーション・フィルタ）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, PENDING, SOLD]
        - name: name
          in: query
          schema:
            type: string
            description: 部分一致検索
      responses:
        "200":
          description: ペット一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPets'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Pets]
      summary: ペット作成（ADMIN）
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreate'
      responses:
        "201":
          description: 作成されたペット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Pets]
      summary: 単一ペット取得
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pets]
      summary: ペット更新（ADMIN）
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        "200":
          description: 更新された Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Pets]
      summary: ペット削除（ADMIN）
      security:
        - BearerAuth: [admin]
      responses:
        "204":
          description: 削除成功（No Content）
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/orders:
    post:
      tags: [Orders]
      summary: 注文作成（認証必須）
      security:
        - BearerAuth: [user,admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        "201":
          description: 作成された注文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Orders]
      summary: 注文一覧（ADMIN は全件、USER は自身の注文）
      security:
        - BearerAuth: [user,admin]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [PLACED, APPROVED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: 注文一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Orders]
      summary: 注文取得（所有者 or ADMIN）
      security:
        - BearerAuth: [user,admin]
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Orders]
      summary: 注文更新（ADMIN 権限でステータス更新など）
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PLACED, APPROVED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: 更新された Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/auth/register:
    post:
      tags: [Auth]
      summary: ユーザー登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        "201":
          description: 登録成功（パスワード除く User を返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: ログイン（JWT 発行）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: トークン発行
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresInSeconds:
                    type: integer
                  refreshToken:
                    type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Users]
      summary: ユーザー情報取得（自身 or ADMIN）
      security:
        - BearerAuth: [user,admin]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: ユーザー更新（自身 or ADMIN）
      security:
        - BearerAuth: [user,admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: 更新された User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: ユーザー削除（ADMIN）
      security:
        - BearerAuth: [admin]
      responses:
        "204":
          description: 削除成功（No Content）
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [AVAILABLE, PENDING, SOLD]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PetCreate:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [AVAILABLE, PENDING, SOLD]
    PetUpdate:
      allOf:
        - $ref: '#/components/schemas/PetCreate'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            version:
              type: integer
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Order:
      type: object
      required: [id, petId, quantity, status]
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [PLACED, APPROVED, DELIVERED, CANCELLED]
        complete:
          type: boolean
        created_at:
          type: string
          format: date-time
    OrderCreate:
      type: object
      required: [petId, quantity]
      properties:
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        shipDate:
          type: string
          format: date-time
    User:
      type: object
      required: [id, username, email]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        userStatus:
          type: string
          enum: [ACTIVE, INACTIVE, BANNED]
        created_at:
          type: string
          format: date-time
    UserRegister:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        userStatus:
          type: string
          enum: [ACTIVE, INACTIVE, BANNED]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: string
            timestamp:
              type: string
              format: date-time
    PaginatedPets:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
    PaginatedOrders:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
  responses:
    BadRequest:
      description: 入力バリデーションエラー等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 認証エラー（401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 権限エラー（403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: リソース未検出（404）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 競合（409）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: サーバ内部エラー（500）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - BearerAuth: []
tags:
  - name: Pets
    description: ペット管理
  - name: Orders
    description: 注文管理
  - name: Users
    description: ユーザー管理
  - name: Auth
    description: 認証 / 認可
