openapi: 3.0.3
info:
  title: Petstore API
  description: |
    Petstore アプリケーション API 定義（agoncal/agoncal-application-petstore-ee7 の移植向け）。
    すべて JSON 入出力。認証は Bearer JWT を想定。
  version: "1.0.0"
servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:8080
    description: Local development
paths:
  /api/pets:
    get:
      tags: [Pets]
      summary: ペット一覧取得（ページネーション・フィルタ）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, PENDING, SOLD]
        - name: name
          in: query
          schema:
            type: string
            description: 部分一致検索
      responses:
        "200":
          description: ペット一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPets'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Pets]
      summary: ペット作成（ADMIN）
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreate'
      responses:
        "201":
          description: 作成されたペット
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Pets]
      summary: 単一ペット取得
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pets]
      summary: ペット更新（ADMIN）
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        "200":
          description: 更新された Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Pets]
      summary: ペット削除（ADMIN）
      security:
        - BearerAuth: [admin]
      responses:
        "204":
          description: 削除成功（No Content）
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/orders:
    post:
      tags: [Orders]
      summary: 注文作成（認証必須）
      security:
        - BearerAuth: [user,admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        "201":
          description: 作成された注文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Orders]
      summary: 注文一覧（ADMIN は全件、USER は自身の注文）
      security:
        - BearerAuth: [user,admin]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [PLACED, APPROVED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: 注文一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Orders]
      summary: 注文取得（所有者 or ADMIN）
      security:
        - BearerAuth: [user,admin]
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Orders]
      summary: 注文更新（ADMIN 権限でステータス更新など）
      security:
        - BearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PLACED, APPROVED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: 更新された Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/auth/register:
    post:
      tags: [Auth]
      summary: ユーザー登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        "201":
          description: 登録成功（パスワード除く User を返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: ログイン（JWT 発行）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: トークン発行
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresInSeconds:
                    type: integer
                  refreshToken:
                    type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
  /api/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Users]
      summary: ユーザー情報取得（自身 or ADMIN）
      security:
        - BearerAuth: [user,admin]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: ユーザー更新（自身 or ADMIN）
      security:
        - BearerAuth: [user,admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          description: 更新された User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: ユーザー削除（ADMIN）
      security:
        - BearerAuth: [admin]
      responses:
        "204":
          description: 削除成功（No Content）
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [AVAILABLE, PENDING, SOLD]
